name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check the version (and the tag, on a tag run)
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if ($env:IS_TAG -eq 'true') { node app/scripts/version.mjs check --tag $env:TAG } else { node app/scripts/version.mjs check }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Rust 1.90.0
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.90.0
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@1.58.0,git-cliff@2.14.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install npm packages
        working-directory: app
        run: npm ci
      - name: Test
        run: just test
      - name: Lint
        run: just lint
      - name: Bundle the installer
        run: just bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breccia-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: git-cliff@2.14.2
      - name: Write the release notes and a CHANGELOG preview
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [[ "$IS_TAG" == "true" ]]; then
            node app/scripts/release.mjs notes "$TAG" > release-notes.tmp && mv release-notes.tmp release-notes.md
          else
            git-cliff --unreleased --strip all -o release-notes.md
            if ! grep -q '^- ' release-notes.md; then echo 'No user-visible changes.' > release-notes.md; fi
            cp CHANGELOG.md changelog-preview.md
            git-cliff --unreleased --prepend changelog-preview.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: |
            release-notes.md
            changelog-preview.md
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build, notes]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: breccia-installer
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.exe --verify-tag --title "Breccia ${TAG#v}" --notes-file notes/release-notes.md "${flags[@]}"
