[package]
name = "breccia-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "breccia_core"

[dependencies]
serde = { version = "1.0.185", features = ["derive"] }
toml = "1.1"
chrono = "0.4"
thiserror = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
notify = "8"
notify-debouncer-full = "0.7"
toml_edit = "0.25.17"
rusqlite = { version = "0.41.1", features = ["bundled"] }
unicode-normalization = "0.1.26"
serde_json = "1"
log = "0.4"
ts-rs = { version = "12.0.1", optional = true, features = ["no-serde-warnings"] }

[features]
# Hooks the Git engine tests use to land a save at an exact moment.
test-seams = []
# The window's TypeScript types (`app/src/lib/generated.ts`), written by `just types`; tests only.
wire-types = ["dep:ts-rs"]

[dev-dependencies]
breccia-core = { path = ".", features = ["test-seams", "wire-types"] }
tempfile = "3"
proptest = "1"
