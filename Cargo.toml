[workspace]
members = ["crates/core", "app/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.4.0"
license = "MIT"

# Keep target/ small. Debug builds keep file and line for panics and
# backtraces, but no variable info, and dependencies get no debug info at all.
# The test profile inherits from dev. The release profile is unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
